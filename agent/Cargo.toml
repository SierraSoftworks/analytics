[package]
name = "analytics"
description = "Lightweight, privacy-preserving analytics for your websites and applications."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
analytics-api.workspace = true
zoneinfo.workspace = true

actix-web.workspace = true
actix-cors.workspace = true
actix-service.workspace = true
futures.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
humantime-serde.workspace = true
chrono.workspace = true
include_dir.workspace = true
dotenvy.workspace = true
tracing-batteries.workspace = true
human-errors.workspace = true
filt-rs.workspace = true
woothee.workspace = true
httpdate.workspace = true
url.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
sha2.workspace = true
uuid.workspace = true
duckdb.workspace = true
redb.workspace = true
ulid.workspace = true

[features]
default = ["bundled-duckdb"]
# Compile libduckdb from source into the binary, keeping it fully
# self-contained — the default for local development and for release builds.
# CI's per-push builds disable this (`--no-default-features` with
# `DUCKDB_DOWNLOAD_LIB=1`) and link a downloaded prebuilt library instead: the
# libduckdb-sys build script fetches the exact version its crate release wraps
# and caches it under `target/duckdb-download`, cutting cold builds by many
# minutes without any version pinning to maintain.
bundled-duckdb = ["duckdb/bundled"]

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
vergen = { version = "8.3", features = ["git", "gitcl"] }
