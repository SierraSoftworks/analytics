name: Rust
on:
  push: {}
  pull_request: {}
  release:
    types: [published]

env:
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  ui:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Trunk
        run: cargo binstall --no-confirm trunk

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Build UI
        working-directory: ui
        run: trunk build --release

      - name: Upload UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  tracker:
    name: Build Tracker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker/package-lock.json

      - name: Install dependencies
        working-directory: tracker
        run: npm ci

      - name: Test
        working-directory: tracker
        run: npm test

      - name: Build
        working-directory: tracker
        run: npm run build

      - name: Upload tracker bundle
        uses: actions/upload-artifact@v7
        with:
          name: tracker-dist
          path: tracker/dist

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # Tests link DuckDB from the prebuilt library that libduckdb-sys
      # downloads for its exact crate version, instead of compiling DuckDB from
      # source via the default `bundled-duckdb` feature — cutting many minutes
      # off cold builds. Cargo puts the library on the test binaries' load path
      # itself.
      #
      # The download must be cached separately: rust-cache prunes directories
      # it doesn't recognise inside target/ when saving, which would strand a
      # warm build — the cached build-script fingerprint still points at
      # target/duckdb-download, but the library would be gone.
      - name: Cache downloaded libduckdb
        uses: actions/cache@v4
        with:
          path: target/duckdb-download
          key: libduckdb-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Self-heal: if the library is nonetheless missing (evicted cache, first
      # run) while rust-cache holds a fresh libduckdb-sys fingerprint, cargo
      # would skip the build script and the link would fail — drop the
      # fingerprint so the script (and its download) runs again.
      - name: Ensure libduckdb download can rerun
        shell: bash
        run: |
          if [ ! -d target/duckdb-download ]; then
            rm -rf target/*/.fingerprint/libduckdb-sys-* \
                   target/*/*/.fingerprint/libduckdb-sys-* \
                   target/*/build/libduckdb-sys-* \
                   target/*/*/build/libduckdb-sys-*
          fi

      - name: Run tests
        run: cargo test --no-fail-fast --no-default-features
        env:
            RUSTFLAGS: -Cinstrument-coverage
            DUCKDB_DOWNLOAD_LIB: "1"
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    needs:
      - version
      - ui
      - tracker

    strategy:
      matrix:
        include:
          # Windows builds
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            builder: cargo

          # Linux builds
          - arch: amd64
            run_on: ubuntu-latest
            os: linux
            target: x86_64-unknown-linux-gnu
            test: true
            builder: cargo
          # Built natively on GitHub's ARM runners rather than cross-compiled:
          # the cross containers' old sysroot can neither link the prebuilt
          # libduckdb (needs GLIBC_2.25/GLIBCXX_3.4.22) nor compile bundled
          # DuckDB's C++17. 22.04's glibc (2.35) predates Debian bookworm's
          # (2.36), so the binary is guaranteed to run in the Docker image.
          - arch: "arm64"
            os: linux
            run_on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo

          # Apple MacOS builds
          - arch: amd64
            run_on: macos-latest
            os: darwin
            target: x86_64-apple-darwin
            builder: cargo
          - arch: arm64
            run_on: macos-latest
            os: darwin
            target: aarch64-apple-darwin
            builder: cargo

    steps:
      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile

      - name: Fetch UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Fetch tracker bundle
        uses: actions/download-artifact@v8
        with:
          name: tracker-dist
          path: tracker/dist

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Per-push builds link DuckDB from the prebuilt library that libduckdb-sys
      # downloads for its exact crate version (DUCKDB_DOWNLOAD_LIB=1), skipping
      # the multi-minute bundled C++ build. These binaries need libduckdb on
      # the library path at runtime and exist only to validate the build.
      # Release builds keep the default `bundled-duckdb` feature so the
      # published artifacts and Docker image stay fully self-contained.
      - name: Select DuckDB linkage
        if: github.event_name != 'release'
        shell: bash
        run: |
          echo "CARGO_FLAGS=--no-default-features" >> "$GITHUB_ENV"
          echo "DUCKDB_DOWNLOAD_LIB=1" >> "$GITHUB_ENV"

      # The download must be cached separately: rust-cache prunes directories
      # it doesn't recognise inside target/ when saving, which would strand a
      # warm build — the cached build-script fingerprint still points at
      # target/duckdb-download, but the library would be gone.
      - name: Cache downloaded libduckdb
        if: github.event_name != 'release'
        uses: actions/cache@v4
        with:
          path: target/duckdb-download
          key: libduckdb-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # Self-heal: if the library is nonetheless missing (evicted cache, first
      # run) while rust-cache holds a fresh libduckdb-sys fingerprint, cargo
      # would skip the build script and the link would fail — drop the
      # fingerprint so the script (and its download) runs again.
      - name: Ensure libduckdb download can rerun
        if: github.event_name != 'release'
        shell: bash
        run: |
          if [ ! -d target/duckdb-download ]; then
            rm -rf target/*/.fingerprint/libduckdb-sys-* \
                   target/*/*/.fingerprint/libduckdb-sys-* \
                   target/*/build/libduckdb-sys-* \
                   target/*/*/build/libduckdb-sys-*
          fi

      - name: cargo build
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }} ${{ env.CARGO_FLAGS }}

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/analytics${{ matrix.extension }} | analytics-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: analytics-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/analytics${{ matrix.extension }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - build

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: analytics-${{ env.PLATFORM_PAIR }}

      - name: mark artifact as executable
        run: |
          chmod +x analytics

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=Lightweight, privacy-preserving analytics for your websites and applications
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
